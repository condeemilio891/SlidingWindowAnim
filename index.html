<div class="reveal">

            <div style="text-align: center;">		
<div style="text-align: center;">
  <h6>Rescue Boats Sorted</h6>
  <h6>Two Pointers + Greedy</h6>
  <p class="limit-label">

    <span>Boat limit: 5</span>

</p>

        <g class="ptr-left" transform="translate(-75, -44)">

        </g>
        <g class="ptr-right" transform="translate(75, -44)">
            <text class="ptr-arrow">↓</text>
        </g>

		<!-- people -->
		<!-- weight 5 -->

		<script >

			const LOOP_MS = 14000;   // 25s per cycle — tune below

				function replay() {
				const root = document.documentElement;
				root.classList.remove('playing');
				void root.offsetWidth;        // force reflow so the browser sees the change
				root.classList.add('playing');
				}

				// Kick it off after Reveal has rendered the first slide
				Reveal.on('ready', () => {
				replay();
				//setInterval(replay, LOOP_MS); //NO REPLAY
				});

		</script>
